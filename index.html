<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thumb Studio</title>
<link rel="stylesheet" href="style.css?v=23">
</head>
<body>
<header class="top">
  <b class="logo">THUMB<span>STUDIO</span></b>
  <select id="niche"><option value="*">All styles</option><option value="mrbeast" selected>MrBeast style</option><option value="crime">True crime</option><option value="tech">Tech</option><option value="music">Music</option><option value="gaming">Gaming</option><option value="classic">Classic</option></select>
  <select id="type"></select>
  <div class="seg" id="ratio">
    <button data-r="16:9" class="on">16:9</button><button data-r="9:16">9:16</button>
  </div>
  <button id="folder" title="Pick a folder; downloads save there">FOLDER</button>
  <button id="shuffle">SHUFFLE</button>
</header>
<main>
  <aside class="panel" id="panel">
    <div class="drops">
      <label class="drop" data-slot="cover"><input type="file" accept="image/*" hidden><span>Main image<br><small>cover, screenshot, photo</small></span></label>
      <label class="drop" data-slot="person" data-cut><input type="file" accept="image/*" hidden><span>Main person<br><small>auto cut-out</small></span></label>
      <label class="drop" data-slot="person2" data-cut><input type="file" accept="image/*" hidden><span>2nd person<br><small>auto cut-out</small></span></label>
      <label class="drop" data-slot="item" data-cut><input type="file" accept="image/*" hidden><span>Prop / product<br><small>auto cut-out</small></span></label>
    </div>
    <label>Title<input id="title" value="I Survived 100 Days"></label>
    <label>Big words (1–3, for loud styles)<input id="big" placeholder="auto from title"></label>
    <label>Label (custom type)<input id="label" placeholder="auto from type"></label>
    <label>Footer<input id="footer" value="YOURCHANNEL"></label>
    <label>Accent<input id="accent" type="color" value="#e0242f"></label>
    <label data-f="name"><span>Name</span><input id="artist" placeholder="optional"></label>
    <div class="row">
      <label data-f="cat"><span>Topic</span><input id="genre"></label>
      <label data-f="mood"><span>Hook</span><input id="mood"></label>
    </div>
    <div class="row">
      <label data-f="bpm"><span>BPM</span><input id="bpm" inputmode="numeric"></label>
      <label data-f="key"><span>Key</span><input id="key"></label>
      <label data-f="ep"><span>Episode #</span><input id="ep" inputmode="numeric"></label>
    </div>
    <label>Link<input id="link" placeholder="https://yoursite.com/item"></label>
  </aside>
  <div class="right">
    <section class="grid" id="grid"></section>
    <div class="phead">
      <b>YOUTUBE PACKAGES</b>
      <select id="count"><option>3</option><option selected>4</option><option>5</option><option>6</option></select>
      <button id="regen">REGENERATE</button>
    </div>
    <section class="packs" id="packs"></section>
  </div>
</main>
<script type="module" src="app.js?v=23"></script>
</body>
</html>
